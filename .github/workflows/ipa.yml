# Gera o app de iPhone (.ipa sem assinatura) num Mac do GitHub e publica numa "Release",
# junto com a fonte do SideStore. O SideStore assina o .ipa com o seu ID Apple ao instalar.
#
# Fonte para colocar no SideStore (sempre aponta para a versão mais nova):
#   https://github.com/isabellaR-a6/projeto/releases/latest/download/fonte.json
#
# Roda sozinho quando algo muda em app_flet/, ou à mão em: Actions > "App iPhone (IPA)" > Run workflow.
name: App iPhone (IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app_flet/**"
      - ".github/workflows/ipa.yml"

concurrency:
  group: ipa
  cancel-in-progress: true

permissions:
  contents: write   # para criar a Release com o .ipa e a fonte

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app_flet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o Flet
        run: pip install "flet==1.0.3" "flet-cli==1.0.3"

      # O Flet monta o projeto inteiro (Python, bibliotecas, ícone). No fim ele tenta "arquivar" no Xcode,
      # que exige uma equipe de desenvolvedor Apple; esse passo final pode falhar e tudo bem.
      - name: Preparar o projeto (Flet)
        env:
          PYTHONUTF8: "1"
        run: |
          flet build ipa --yes --no-rich-output --project minhas-financas --product "Minhas Finanças" --org br.com.minhasfinancas --build-number ${{ github.run_number }} --verbose > build.log 2>&1 || true
          tail -n 25 build.log
          test -f build/flutter/pubspec.yaml || { echo "O Flet não criou o projeto"; exit 1; }

      # Compila o app sem assinatura (o SideStore assina na instalação).
      - name: Compilar sem assinatura
        run: |
          set -o pipefail
          FLUTTER=$(ls -d "$HOME"/flutter/*/bin/flutter | head -1)
          VERSAO_APP=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          cd build/flutter
          "$FLUTTER" build ios --release --no-codesign --build-number ${{ github.run_number }} --build-name "$VERSAO_APP" 2>&1 | tee ../../flutter.log

      # Se der erro, publica as últimas linhas como "anotação" (visível sem login no repositório público),
      # para dar para ver o motivo sem baixar o registro completo.
      - name: Mostrar o erro
        if: failure()
        run: |
          cat build.log flutter.log 2>/dev/null > tudo.log || true
          grep -iE "error|exception|failed|not found|could not|no matching|traceback" tudo.log | tail -n 40 > erros.txt || true
          tail -n 40 tudo.log > final.txt
          for arq in erros.txt final.txt; do
            msg=$(tr -d '\015' < "$arq" | sed -e 's/%/%25/g' | cut -c1-300 | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=$arq::$msg"
          done

      - name: Montar o .ipa
        run: |
          APP=$(ls -d build/flutter/build/ios/iphoneos/*.app | head -1)
          if [ -z "$APP" ]; then echo "Não achei o .app"; find build/flutter/build -maxdepth 3; exit 1; fi
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry MinhasFinancas.ipa Payload
          ls -lh MinhasFinancas.ipa
          PLIST="$APP/Info.plist"
          echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" >> "$GITHUB_ENV"
          echo "VERSAO=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" >> "$GITHUB_ENV"
          echo "MIN_IOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST" 2>/dev/null || echo 13.0)" >> "$GITHUB_ENV"
          echo "TAMANHO=$(stat -f%z MinhasFinancas.ipa)" >> "$GITHUB_ENV"

      - name: Escrever a fonte do SideStore (fonte.json)
        env:
          REPO: ${{ github.repository }}
          TAG: ios-${{ github.run_number }}
          BUILD: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          e = os.environ
          base = f"https://github.com/{e['REPO']}"
          icone = f"https://raw.githubusercontent.com/{e['REPO']}/main/app_flet/assets/icon.png"
          fonte = {
              "name": "Minhas Finanças",
              "identifier": "br.com.minhasfinancas.fonte",
              "subtitle": "Controle financeiro pessoal",
              "iconURL": icone,
              "tintColor": "5b2a86",
              "apps": [{
                  "name": "Minhas Finanças",
                  "bundleIdentifier": e["BUNDLE_ID"],
                  "developerName": "Isabella Radael",
                  "subtitle": "Cartões, faturas, parcelas e metas",
                  "localizedDescription": "Controle financeiro pessoal feito em Python com Flet.",
                  "iconURL": icone,
                  "tintColor": "5b2a86",
                  "versions": [{
                      "version": e["VERSAO"],
                      "buildVersion": e["BUILD"],
                      "date": datetime.date.today().isoformat(),
                      "localizedDescription": f"Versão {e['VERSAO']} ({e['BUILD']}).",
                      "downloadURL": f"{base}/releases/download/{e['TAG']}/MinhasFinancas.ipa",
                      "size": int(e["TAMANHO"]),
                      "minOSVersion": e["MIN_IOS"],
                  }],
                  "appPermissions": {"entitlements": [], "privacy": {
                      "NSFaceIDUsageDescription": "Use o Face ID para abrir o Minhas Finanças."}},
              }],
              "news": [],
          }
          json.dump(fonte, open("fonte.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(open("fonte.json", encoding="utf-8").read())
          PY

      - name: Publicar a Release (.ipa + fonte)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "ios-${{ github.run_number }}"
          MinhasFinancas.ipa fonte.json
          --repo "${{ github.repository }}"
          --title "App iPhone ${{ env.VERSAO }} (${{ github.run_number }})"
          --notes "Instale pelo SideStore com a fonte: https://github.com/${{ github.repository }}/releases/latest/download/fonte.json"
          --latest

      - uses: actions/upload-artifact@v4
        with:
          name: MinhasFinancas-ipa
          path: app_flet/MinhasFinancas.ipa
          retention-days: 30
